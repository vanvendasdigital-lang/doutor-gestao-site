[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/kit-auditoria-interna-iso-9001/*"
  to = "/kit-auditoria-interna-iso-9001-2026/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/curso-auditor-interno-iso-9001/*"
  to = "/curso-auditor-interno-iso-9001-2015/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/curso-auditor-iso-9001-vendas/*"
  to = "/curso-auditor-iso-9001-2015-vendas/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/colecao-curso-iso-9001/*"
  to = "/colecao-curso-iso-9001-2015/:splat"
  status = 301
  force = true

# Artigos duplicados (mesmo titulo/data, conteudo quase identico) removidos
# do catalogo em 04/11/2026 — redireciona pra versao canonica.
[[redirects]]
  from = "/sistemas-de-gestao-legados-que-duram-2/*"
  to = "/sistemas-de-gestao-legados-que-duram/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/iso-9001-e-a-sua-carreira-profissional-2/*"
  to = "/iso-9001-e-a-sua-carreira-profissional/:splat"
  status = 301
  force = true

# Endereco antigo de sitemap que o Search Console reportava como quebrado.
[[redirects]]
  from = "/sitemap_index.xml"
  to = "/sitemap.xml"
  status = 301
  force = true
